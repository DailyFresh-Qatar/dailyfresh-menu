<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="refresh" content="900" />
        <title>Daily Fresh — Digital Menu Board</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@200;300;400&display=swap"
            rel="stylesheet"
        />
        <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

        <style>
            /* =======================================================================
     CORE LAYOUT & TYPOGRAPHY
  ======================================================================= */
            :root {
                --bg-dark: #0a2e15; /* Deep DailyFresh Green */
                --text-light: #ffffff;
                --gold-accent: #fcd116; /* Cafeteria Yellow */
                --gold-muted: rgba(252, 209, 22, 0.3);
                --desc-color: #a3c9b1; /* Light green-grey for descriptions */
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body,
            html {
                width: 100vw;
                height: 100vh;
                overflow: hidden;
                background-color: var(--bg-dark);
                font-family: "Jost", sans-serif;
                color: var(--text-light);
            }

            #display-container {
                display: flex;
                width: 100%;
                height: 100%;
            }

            /* =======================================================================
     LEFT PANEL: CINEMATIC VISUALS (FIXED FOR TV PERFORMANCE)
  ======================================================================= */
            #visual-zone {
                width: 58%;
                height: 100%;
                position: relative;
                overflow: hidden;
                box-shadow: inset -20px 0 50px rgba(10, 46, 21, 0.9); /* Matched to green bg */
                z-index: 2;
                background-color: #0a2e15; /* FALLBACK: If images fail to load, it stays brand green, not black */
            }

            .bg-image {
                /* Pulled out further to make room for a bigger zoom */
                position: absolute;
                inset: -5%;
                width: 110%;
                height: 110%;
                background-size: cover;
                background-position: center;
                opacity: 0;

                will-change: opacity, transform;
                transform: translateZ(0) scale(1);

                /* 2s fade, 10s zoom (perfectly matches your JS tick timer) */
                transition:
                    opacity 2s ease-in-out,
                    transform 10s linear;
                filter: brightness(0.65) saturate(1.1);
            }

            .bg-image.active {
                opacity: 1;
                /* Zoomed in 8%. You will absolutely see this moving. */
                transform: translateZ(0) scale(1.08);
            }

            @keyframes panZoomIn {
                from {
                    transform: scale(1) translate(0, 0);
                }
                to {
                    transform: scale(1.08) translate(-1%, 1%);
                }
            }
            @keyframes panZoomOut {
                from {
                    transform: scale(1.08) translate(-1%, 0);
                }
                to {
                    transform: scale(1) translate(1%, -1%);
                }
            }

            /* Branding Overlay */
            .brand-overlay {
                position: absolute;
                bottom: 0;
                left: 0;
                width: 100%;
                padding: 6vw 4vw 4vw 4vw;
                background: linear-gradient(to top, rgba(13, 10, 7, 0.95) 0%, rgba(13, 10, 7, 0.6) 40%, transparent 100%);
                z-index: 3;
            }

            .brand-logo {
                font-family: "Cormorant Garamond", serif;
                font-size: 5.5vw;
                font-weight: 300;
                letter-spacing: 0.15em;
                color: var(--text-light);
                line-height: 1;
                margin-bottom: 0.5vw;
            }

            .brand-tagline {
                font-size: 1.2vw;
                font-weight: 200;
                letter-spacing: 0.4em;
                color: var(--gold-accent);
                text-transform: uppercase;
            }

            /* =======================================================================
     RIGHT PANEL: MENU & OFFERS
  ======================================================================= */
            #content-zone {
                width: 42%;
                height: 100%;
                display: flex;
                flex-direction: column;
                padding: 3vw;
                position: relative;
                background: linear-gradient(140deg, #110e0a, var(--bg-dark));
                border-left: 1px solid rgba(200, 146, 42, 0.15);
            }

            /* Header / Clock */
            .top-bar {
                display: flex;
                justify-content: flex-end;
                align-items: center;
                padding-bottom: 1.5vw;
                border-bottom: 1px solid var(--gold-muted);
                margin-bottom: 2.5vw;
            }

            #clock {
                font-size: 1.2vw;
                letter-spacing: 0.3em;
                color: var(--desc-color);
                font-weight: 300;
            }

            /* Slide Container */
            #slider-wrapper {
                flex-grow: 1;
                position: relative;
            }

            .content-slide {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                opacity: 0;
                transform: translateY(20px);
                transition:
                    opacity 0.8s ease,
                    transform 0.8s ease;
                pointer-events: none;
            }
            .content-slide.active {
                opacity: 1;
                transform: translateY(0);
                pointer-events: auto;
            }

            .category-title {
                font-size: 0.9vw;
                letter-spacing: 0.45em;
                text-transform: uppercase;
                color: var(--gold-accent);
                font-weight: 300;
                margin-bottom: 2vw;
            }

            /* Menu Items Layout */
            .menu-list {
                display: flex;
                flex-direction: column;
                gap: 2.2vw;
            }
            .menu-item {
                display: flex;
                flex-direction: column;
            }

            .item-header {
                display: flex;
                align-items: flex-end;
                justify-content: space-between;
                margin-bottom: 0.4vw;
            }
            .item-name {
                font-family: "Cormorant Garamond", serif;
                font-size: 2.3vw;
                font-weight: 400;
                color: var(--text-light);
                line-height: 1;
            }
            .item-dots {
                flex-grow: 1;
                border-bottom: 2px dotted var(--gold-muted);
                margin: 0 1vw 0.4vw 1vw;
                opacity: 0.6;
            }
            .item-price {
                font-family: "Cormorant Garamond", serif;
                font-size: 2.3vw;
                color: var(--gold-accent);
                font-weight: 300;
                line-height: 1;
            }

            .item-desc {
                font-size: 1.1vw;
                color: var(--desc-color);
                font-weight: 300;
                max-width: 85%;
                line-height: 1.4;
            }

            /* Special Offer Layout - FIXED FOR OVERLAP */
            .offer-box {
                border: 1px solid var(--gold-muted);
                padding: 1.5vw;
                text-align: center; /* Shrunk from 3vw */
                background: radial-gradient(ellipse at center, rgba(200, 146, 42, 0.08) 0%, transparent 70%);
                margin-top: 1vw;
                position: relative; /* Shrunk from 2vw */
            }
            .offer-headline {
                font-family: "Cormorant Garamond", serif;
                font-size: 4vw;
                font-weight: 300;
                line-height: 1.1;
                margin-bottom: 0.5vw; /* Shrunk from 1vw */
            }
            .offer-headline em {
                color: var(--gold-accent);
                font-style: italic;
            }
            .offer-desc {
                font-size: 1.2vw;
                color: var(--desc-color);
                margin-bottom: 1vw; /* Shrunk from 2vw */
            }
            .offer-price {
                font-family: "Cormorant Garamond", serif;
                font-size: 3.5vw;
                color: var(--gold-accent);
                font-weight: 400;
            }

            /* =======================================================================
     PERSISTENT QR WIDGET
  ======================================================================= */
            .qr-container {
                display: flex;
                align-items: center;
                gap: 1.5vw;
                margin-top: auto;
                padding-top: 2vw;
                border-top: 1px solid var(--gold-muted);
            }

            .qr-frame {
                background: #f5efe4;
                padding: 0.6vw;
                border: 1px solid var(--gold-accent);
                position: relative;
                flex-shrink: 0;
            }

            /* Corner Ornaments for QR */
            .qr-frame::before,
            .qr-frame::after,
            .qr-frame .cb,
            .qr-frame .cb2 {
                content: "";
                position: absolute;
                width: 0.6vw;
                height: 0.6vw;
            }
            .qr-frame::before {
                top: -2px;
                left: -2px;
                border-top: 2px solid var(--gold-accent);
                border-left: 2px solid var(--gold-accent);
            }
            .qr-frame::after {
                top: -2px;
                right: -2px;
                border-top: 2px solid var(--gold-accent);
                border-right: 2px solid var(--gold-accent);
            }
            .qr-frame .cb {
                bottom: -2px;
                left: -2px;
                border-bottom: 2px solid var(--gold-accent);
                border-left: 2px solid var(--gold-accent);
            }
            .qr-frame .cb2 {
                bottom: -2px;
                right: -2px;
                border-bottom: 2px solid var(--gold-accent);
                border-right: 2px solid var(--gold-accent);
            }

            #qrcode canvas,
            #qrcode img {
                display: block;
                width: 5.5vw !important;
                height: 5.5vw !important;
            }

            .qr-text h3 {
                font-family: "Cormorant Garamond", serif;
                font-size: 1.8vw;
                font-weight: 400;
                color: var(--text-light);
                margin-bottom: 0.2vw;
            }
            .qr-text p {
                font-size: 0.9vw;
                letter-spacing: 0.1em;
                text-transform: uppercase;
                color: var(--gold-accent);
                font-weight: 300;
            }
        </style>
    </head>
    <body>
        <div id="display-container">
            <div id="visual-zone">
                <div id="bg-layer-1" class="bg-image zoom-in active"></div>
                <div id="bg-layer-2" class="bg-image zoom-out"></div>

                <div class="brand-overlay">
                    <div class="brand-logo" id="ui-brand-name">Brand</div>
                    <div class="brand-tagline" id="ui-brand-tagline">Tagline</div>
                </div>
            </div>

            <div id="content-zone">
                <div class="top-bar">
                    <div id="clock">00:00</div>
                </div>

                <div id="slider-wrapper"></div>

                <div class="qr-container">
                    <div class="qr-frame">
                        <div class="cb"></div>
                        <div class="cb2"></div>
                        <div id="qrcode"></div>
                    </div>
                    <div class="qr-text">
                        <h3>Scan for Full Menu</h3>
                        <p>View all 100+ items on your phone</p>
                    </div>
                </div>
            </div>
        </div>

        <script>
            const CONFIG = {
                shopName: "DailyFresh",
                shopTagline: "Your Daily Taste Of Freshness · Doha",

               
                qrLink: "https://dailyfresh-qatar.github.io/dailyfresh-menu/menuDailyFresh.pdf",

                // Updated to 8 seconds per screen
                tickDurationMs: 8000,

                // Pointing to local images inside the images folder
                images: [
                    "./images/bg-1.jpg", // Breakfast
                    "./images/bg-2.jpg", // Biriyani
                    "./images/bg-3.jpeg", // Chinese
                    "./images/bg-4.jpg", // BBQ
                    "./images/bg-5.jpg", // Burgers
                    "./images/bg-6.jpg", // Specials
                ],

                screens: [
                    {
                        type: "menu",
                        category: "Breakfast (إفطار)",
                        items: [
                            { name: "Masala Dosa", price: "QAR 6", desc: "Crispy crepe filled with spiced potato masala" },
                            { name: "Ghee Roast", price: "QAR 5", desc: "Classic golden dosa roasted in pure ghee" },
                            {
                                name: "Idly & Vada Set",
                                price: "QAR 5 / 4",
                                desc: "Soft steamed rice cakes and crispy lentil donuts",
                            },
                            { name: "Appam / Idiyappam", price: "QAR 1", desc: "Traditional Kerala steamed rice hoppers" },
                        ],
                    },
                    {
                        type: "menu",
                        category: "Dum Biriyani (برياني وأرز)",
                        items: [
                            {
                                name: "Chicken Dum Biriyani",
                                price: "QAR 12",
                                desc: "Aromatic basmati rice cooked with spiced chicken",
                            },
                            {
                                name: "Beef Dum Biriyani",
                                price: "QAR 15",
                                desc: "Slow-cooked beef layered with fragrant rice",
                            },
                            {
                                name: "Mutton Dum Biriyani",
                                price: "QAR 18",
                                desc: "Premium mutton pieces in traditional dum masala",
                            },
                            {
                                name: "Fish Dum Biriyani",
                                price: "QAR 16",
                                desc: "Fresh fish infused with Malabar biriyani spices",
                            },
                        ],
                    },
                    {
                        type: "menu",
                        category: "Chinese (صيني)",
                        items: [
                            {
                                name: "Chicken Fried Rice",
                                price: "QAR 13",
                                desc: "Wok-tossed rice with chicken and vegetables",
                            },
                            { name: "Beef Noodles", price: "QAR 13", desc: "Stir-fried noodles with tender beef strips" },
                            {
                                name: "Schezwan Mixed Rice",
                                price: "QAR 16",
                                desc: "Spicy fried rice with chicken, beef, and prawns",
                            },
                            {
                                name: "Prawns Noodles",
                                price: "QAR 14",
                                desc: "Classic wok noodles tossed with fresh prawns",
                            },
                        ],
                    },
                    {
                        type: "menu",
                        category: "Charcoal BBQ (شواء خاص)",
                        items: [
                            {
                                name: "Chicken B.B.Q",
                                price: "QAR 14/28",
                                desc: "Classic marinated charcoal-grilled chicken (Half/Full)",
                            },
                            {
                                name: "Chicken Pepper B.B.Q",
                                price: "QAR 15/30",
                                desc: "Spicy black pepper marinated grilled chicken",
                            },
                            {
                                name: "Fish B.B.Q",
                                price: "As Per Size",
                                desc: "Fresh catch marinated in spicy or normal masala",
                            },
                            {
                                name: "BBQ with Rice",
                                price: "QAR 20",
                                desc: "Special combo: Grilled chicken served with flavored rice",
                            },
                        ],
                    },
                    {
                        type: "menu",
                        category: "Burgers (البرجر)",
                        items: [
                            {
                                name: "Chicken Zinker Burger",
                                price: "QAR 12",
                                desc: "Crispy fried spicy chicken fillet burger",
                            },
                            { name: "Double Burger", price: "QAR 12", desc: "Double patty burger loaded with cheese" },
                            {
                                name: "Beef Burger",
                                price: "QAR 6/8/10",
                                desc: "Classic grilled beef patty (Small/Medium/Large)",
                            },
                            {
                                name: "Veg Burger with Chips",
                                price: "QAR 8",
                                desc: "Crispy vegetable patty served with fries",
                            },
                        ],
                    },
                    {
                        type: "offer",
                        category: "Daily Specials",
                        headline: "Today's<br><em>Fresh Catch</em>",
                        desc: "Ask our staff about today's fresh Fish Pollichath, Mango Curry, and Tawa Fry specials.",
                        price: "Fresh Daily",
                        note: "Bin Omran, Near Aysha Masjid | Scan QR for 100+ Items",
                    },
                ],
            };

            // 1. Initialize UI Text
            document.getElementById("ui-brand-name").innerHTML = CONFIG.shopName;
            document.getElementById("ui-brand-tagline").innerHTML = CONFIG.shopTagline;

            // 2. Initialize QR Code locally
            // Make sure you still have <script src="...qrcode.min.js"> in your <head>
            if (document.getElementById("qrcode")) {
                new QRCode(document.getElementById("qrcode"), {
                    text: CONFIG.qrLink,
                    width: 200,
                    height: 200,
                    colorDark: "#0a2e15", // Dark green
                    colorLight: "#f5efe4", // Cream
                    correctLevel: QRCode.CorrectLevel.H,
                });
            }

            // 3. Clock ticking
            function updateClock() {
                const now = new Date();

                // This forces 12-hour format with AM/PM for Doha, Qatar
                const qatarTime = now.toLocaleString("en-US", {
                    timeZone: "Asia/Qatar",
                    hour: "numeric",
                    minute: "2-digit",
                    hour12: true,
                });

                document.getElementById("clock").textContent = qatarTime;
            }
            updateClock();
            setInterval(updateClock, 1000);

            // 4. Build Menu DOM Elements ONCE (Prevents Memory Leaks)
            const sliderWrapper = document.getElementById("slider-wrapper");
            let slideElements = [];

            CONFIG.screens.forEach((screen, index) => {
                const slideDiv = document.createElement("div");
                slideDiv.className = `content-slide ${index === 0 ? "active" : ""}`;

                let html = `<div class="category-title">${screen.category}</div>`;

                if (screen.type === "menu") {
                    html += `<div class="menu-list">`;
                    screen.items.forEach((item) => {
                        html += `
          <div class="menu-item">
            <div class="item-header">
              <div class="item-name">${item.name}</div>
              <div class="item-dots"></div>
              <div class="item-price">${item.price}</div>
            </div>
            <div class="item-desc">${item.desc}</div>
          </div>`;
                    });
                    html += `</div>`;
                } else if (screen.type === "offer") {
                    html += `
        <div class="offer-box">
          <div class="offer-headline">${screen.headline}</div>
          <div class="offer-desc">${screen.desc}</div>
          <div class="offer-price">${screen.price}</div>
          <div class="item-desc" style="margin-top: 1vw; max-width:100%; text-align:center;">${screen.note}</div>
        </div>`;
                }

                slideDiv.innerHTML = html;
                sliderWrapper.appendChild(slideDiv);
                slideElements.push(slideDiv);
            });

            // 5. Unified Display Loop (Syncs logic perfectly)
            const bg1 = document.getElementById("bg-layer-1");
            const bg2 = document.getElementById("bg-layer-2");
            bg1.style.backgroundImage = `url('${CONFIG.images[0]}')`;

            let currentTickIndex = 0;
            let activeLayer = 1;

            function rotateDisplay() {
                if (slideElements.length <= 1) return;

                // A. Fade out old slide
                slideElements[currentTickIndex % slideElements.length].classList.remove("active");

                // Increment index
                currentTickIndex++;

                // B. Fade in new slide
                slideElements[currentTickIndex % slideElements.length].classList.add("active");

                // C. Swap Background Image simultaneously
                const nextImgUrl = `url('${CONFIG.images[currentTickIndex % CONFIG.images.length]}')`;

                if (activeLayer === 1) {
                    bg2.style.backgroundImage = nextImgUrl;
                    bg2.classList.add("active");
                    bg1.classList.remove("active");
                    activeLayer = 2;
                } else {
                    bg1.style.backgroundImage = nextImgUrl;
                    bg1.classList.add("active");
                    bg2.classList.remove("active");
                    activeLayer = 1;
                }
            }

            // Start the master loop
            setInterval(rotateDisplay, CONFIG.tickDurationMs);
        </script>
    </body>
</html>
